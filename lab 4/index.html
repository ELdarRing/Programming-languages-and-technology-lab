<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Регистрация</h1>

    <form id="registrationForm">

        <div class="form-group">
            <label for="login">Логин:</label>

            <input
                type="text"
                id="login"
                name="login"
                placeholder="Введите логин"
            >

            <small id="loginMessage"></small>
        </div>


        <div class="form-group">
            <label for="email">E-mail:</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@mail.com"
            >

            <small id="emailMessage"></small>
        </div>


        <div class="form-group">
            <label for="password">Пароль:</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Введите пароль"
            >

            <small id="passwordMessage"></small>
        </div>


        <div class="form-group">
            <label for="confirmPassword">
                Подтверждение пароля:
            </label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Повторите пароль"
            >

            <small id="confirmMessage"></small>
        </div>


        <div class="form-group">
            <label for="age">Возраст:</label>

            <input
                type="number"
                id="age"
                name="age"
                min="14"
                max="100"
                placeholder="Введите возраст"
            >

            <small id="ageMessage"></small>
        </div>


        <div class="form-group">

            <label>Пол:</label>

            <label class="radio-label">
                <input
                    type="radio"
                    name="gender"
                    value="Мужской"
                >
                Мужской
            </label>

            <label class="radio-label">
                <input
                    type="radio"
                    name="gender"
                    value="Женский"
                >
                Женский
            </label>

            <small id="genderMessage"></small>

        </div>


        <div class="form-group">

            <label for="city">Город:</label>

            <select id="city" name="city">

                <option value="">
                    Выберите город
                </option>

                <option value="Алматы">
                    Алматы
                </option>

                <option value="Астана">
                    Астана
                </option>

                <option value="Шымкент">
                    Шымкент
                </option>

                <option value="Другой">
                    Другой
                </option>

            </select>

            <small id="cityMessage"></small>

        </div>


        <div class="checkbox-group">

            <label>
                <input
                    type="checkbox"
                    id="agreement"
                >

                Я согласен с правилами регистрации
            </label>

            <small id="agreementMessage"></small>

        </div>


        <button type="submit">
            Зарегистрироваться
        </button>

    </form>


    <div id="result"></div>

</div>


<script src="script.js"></script>

</body>
</html>
