<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        .input-block {
            display: flex;
            gap: 10px;
        }

        #taskInput {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }

        button:hover {
            background-color: #0056b3;
        }

        #taskList {
            list-style: none;
            padding: 0;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            margin-top: 10px;
            background-color: #eeeeee;
            border-radius: 6px;
        }

        .task.completed span {
            text-decoration: line-through;
            color: gray;
        }

        .task span {
            flex: 1;
            margin-left: 10px;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .delete-btn:hover {
            background-color: #a71d2a;
        }

        #counter {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
        }

        #message {
            color: red;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Список задач</h1>

    <div class="input-block">
        <input
            type="text"
            id="taskInput"
            placeholder="Введите новую задачу"
        >
        <button id="addButton">Добавить</button>
    </div>

    <p id="message"></p>

    <ul id="taskList"></ul>

    <p id="counter">
        Выполнено: 0 | Не выполнено: 0
    </p>
</div>

<script src="script.js"></script>

</body>
</html>
